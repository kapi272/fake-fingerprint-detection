{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-lg">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h2 class="text-white">Create Your Account</h2>
                    <p class="text-muted">Register to access the FLD platform</p>
                </div>
                
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label class="form-label text-white">Username</label>
                        <input type="text" name="username" class="form-control" required placeholder="Choose a username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white">Password</label>
                        <input type="password" name="password" class="form-control" required placeholder="Create a password">
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-white">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" required placeholder="Confirm your password">
                    </div>
                    <button type="submit" class="btn btn-accent w-100 py-2">Register</button>
                </form>
                
                <div class="text-center mt-4">
                    <p class="text-muted small">Already have an account? <a href="{{ url_for('login') }}" class="text-accent text-decoration-none">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
